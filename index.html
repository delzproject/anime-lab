<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON LAB</title>
<meta name="theme-color" content="#140A24">
<meta name="description" content="NEON LAB - Tap sticker di video buka tools">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon4.jpg">
<link rel="icon" href="icon4.jpg" type="image/jpeg">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#EDE8F7; --ink:#140A24; --red:#E8233A; --pink:#FF5C8A; --yellow:#FFC93C; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{ background:var(--ink); color:var(--paper); font-family:'Archivo',sans-serif; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; overflow:hidden; padding:12px 10px 10px; }
  .top{ width:min(92vw,400px); display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:10px; }
  .top h1{ font-size:26px; font-weight:900; line-height:.9; letter-spacing:-1px; text-transform:uppercase; }
  .top h1 i{ font-style:normal; color:var(--red); }
  .top .tag{ font-family:'Space Mono',monospace; font-size:10px; border:1.5px solid var(--paper); padding:5px 7px; transform:rotate(2deg); }
  /* STAGE MIRING -4deg */
  .stage{ position:relative; width:min(92vw,400px); height:min(68vh,620px); transform:rotate(-4deg); background:#000; border:2px solid #140A24; outline:3px solid var(--paper); }
  .video-frame{ position:absolute; inset:0; overflow:hidden; background:#000; }
  .video-frame video{ width:100%; height:100%; object-fit:cover; display:block; }
  /* BUTTON PIL PUTIH VERTIKAL - SAMA KAYAK DI VIDEO LU */
  .hotspot{ position:absolute; z-index:10; background:#fff; color:#111; border:2px solid #111; writing-mode:vertical-rl; font-family:'Archivo',sans-serif; font-weight:900; font-size:13px; padding:14px 9px; border-radius:999px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:4px 4px 0 #111; transition:transform .12s, box-shadow .12s, background .12s; will-change:transform; }
  .hotspot svg{ width:16px; height:16px; transform:rotate(90deg); }
  .hotspot small{ font-family:'Space Mono',monospace; font-weight:400; font-size:9px; }
  .b1{ top:9%; left:50%; margin-left:-40px; } .b2{ top:22%; right:3%; background:var(--yellow); } .b3{ top:38%; left:2%; background:var(--paper); } .b4{ top:58%; right:2%; } .b5{ top:48%; left:8%; background:var(--red); color:#fff; border-color:#fff; } .b6{ bottom:22%; left:3%; background:var(--pink); } .b7{ bottom:12%; right:8%; } .b8{ bottom:4%; left:50%; margin-left:-50px; background:var(--ink); color:#fff; border-color:#fff; }
  /* BUTTON ANIMATION PAS DIPENCET */
  .hotspot:active, .hotspot.pressed{ transform:translate(3px,3px) scale(.94) !important; box-shadow:1px 1px 0 #111 !important; background:var(--yellow) !important; color:#111 !important; }
  .hotspot::after{ content:""; position:absolute; inset:-6px; border:1.5px solid #fff; border-radius:999px; opacity:0; pointer-events:none; }
  .hotspot.pressed::after{ animation:ripple .35s ease-out; }
  @keyframes ripple{ 0%{opacity:.9; transform:scale(.8)} 100%{opacity:0; transform:scale(1.25)} }
  .hint{ margin-top:18px; font-family:'Space Mono',monospace; font-size:10px; color:#B8AED6; text-align:center; }
  /* JENDELA MENGAMBANG - MIRING JUGA */
  .overlay{ display:none; position:fixed; inset:0; z-index:100; background:rgba(10,4,22,.82); align-items:center; justify-content:center; padding:18px; } .overlay.open{ display:flex; }
  .window{ width:min(92vw,380px); max-height:80vh; overflow:auto; background:var(--paper); color:var(--ink); border:3px solid var(--ink); border-radius:6px 22px 6px 22px; padding:16px; transform:rotate(2deg); box-shadow:8px 8px 0 var(--red); animation:pop .22s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop{ from{ transform:rotate(2deg) scale(.9) translateY(10px); opacity:0 } to{ transform:rotate(2deg) scale(1) translateY(0); opacity:1 } }
  .window-head{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid var(--ink); padding-bottom:10px; }
  .window h2{ font-size:20px; font-weight:900; line-height:1; text-transform:uppercase; } .window h2 span{ color:var(--red); } .window p{ font-size:12px; line-height:1.5; margin-top:8px; font-weight:500; } .window .meta{ font-family:'Space Mono',monospace; font-size:9px; margin-top:6px; }
  /* CARD - HOVER / PRESS ADA ANIMASI */
  .tool-list{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .tool-card{ background:#fff; color:var(--ink); text-decoration:none; border:2px solid var(--ink); border-radius:10px; padding:12px; display:flex; justify-content:space-between; align-items:center; gap:10px; box-shadow:3px 3px 0 var(--ink); transition:transform .13s, box-shadow .13s, background .13s; }
  .tool-card:hover{ transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--ink); }
  .tool-card:active, .tool-card.pressed{ transform:translate(3px,3px) scale(.98); box-shadow:0 0 0 var(--ink); background:var(--yellow); }
  .tool-card .left{ display:flex; gap:10px; align-items:center; }
  .tool-card .ico{ width:32px; height:32px; border:2px solid var(--ink); display:grid; place-items:center; flex-shrink:0; }
  .tool-card .ico svg{ width:18px; height:18px; }
  .tool-card b{ font-size:13px; display:block; line-height:1.2; } .tool-card small{ font-family:'Space Mono',monospace; font-size:9px; color:#555; } .tool-card .arrow{ font-weight:900; }
  /* SKELETON SHIMMER - LOADING */
  .skeleton{ display:none; flex-direction:column; gap:10px; margin-top:14px; } .skeleton.show{ display:flex; }
  .sk{ height:58px; border:2px solid var(--ink); border-radius:10px; background:#D8D0E8; position:relative; overflow:hidden; }
  .sk::after{ content:""; position:absolute; inset:0; background:linear-gradient(90deg, transparent 20%, rgba(255,255,255,.9) 50%, transparent 80%); transform:translateX(-100%); animation:shimmer 1.1s infinite; }
  @keyframes shimmer{ to{ transform:translateX(100%); } }
  .close-btn{ margin-top:14px; width:100%; padding:13px; border:2px solid var(--ink); border-radius:8px; background:var(--red); color:#fff; font-weight:900; cursor:pointer; font-size:13px; letter-spacing:1px; box-shadow:3px 3px 0 var(--ink); transition:transform .12s, box-shadow .12s; }
  .close-btn:active{ transform:translate(2px,2px); box-shadow:0 0 0 var(--ink); }
</style>
</head>
<body>
<div class="top"><h1>NEON<br><i>LAB_</i></h1><div class="tag">TAP STICKER<br>BUKA TOOLS</div></div>
<div class="stage">
  <div class="video-frame"><video src="animasi2.mp4" autoplay muted loop playsinline preload="auto"></video></div>
  <button class="hotspot b1" onclick="openTool(this,'scan')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>SCAN <small>01</small></button>
  <button class="hotspot b2" onclick="openTool(this,'phishing')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14L21 3l-7 21-3-7-7-3z"/></svg>CEK LINK <small>02</small></button>
  <button class="hotspot b3" onclick="openTool(this,'password')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>PASSWORD <small>03</small></button>
  <button class="hotspot b4" onclick="openTool(this,'ip')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/></svg>IP CHECK <small>04</small></button>
  <button class="hotspot b5" onclick="openTool(this,'pegasus')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2 6 6 1-4.5 4 1 6.5L12 17l-4.5 3.5L8.5 14 4 10l6-1z"/></svg>PEGASUS <small>05</small></button>
  <button class="hotspot b6" onclick="openTool(this,'file')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>CEK FILE <small>06</small></button>
  <button class="hotspot b7" onclick="openTool(this,'email')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 6L2 7"/></svg>EMAIL BOCOR <small>07</small></button>
  <button class="hotspot b8" onclick="openTool(this,'all')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>SEMUA TOOLS <small>08</small></button>
</div>
<div class="hint">VIDEO: animasi2.mp4 — ICON: icon4.jpg — STAGE MIRING -4deg</div>
<div class="overlay" id="overlay" onclick="if(event.target===this) closeTool()">
  <div class="window">
    <div class="window-head"><h2 id="wTitle">TOOLS <span>_</span></h2><span style="font-family:'Space Mono',monospace;font-size:10px;border:1.5px solid #140A24;padding:4px 6px;">NEON LAB</span></div>
    <p id="wDesc">Deskripsi</p><div class="meta" id="wMeta">—</div>
    <div class="skeleton" id="skeleton"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
    <div class="tool-list" id="wList"></div>
    <button class="close-btn" onclick="closeTool()">TUTUP [X]</button>
  </div>
</div>
<script>
const DATA = {
  scan:{title:"SCAN <span>_</span>", desc:"Cek file, link, dan HP lu kena malware atau enggak.", meta:"3 TOOLS / GRATIS", tools:[["VirusTotal","Scan file & link","https://www.virustotal.com"],["URLScan","Lihat isi link tanpa buka","https://urlscan.io"],["Hybrid Analysis","Sandbox file mencurigakan","https://www.hybrid-analysis.com"]]},
  phishing:{title:"CEK LINK <span>_</span>", desc:"Link WA / SMS yang lu dapet itu asli atau jebakan.", meta:"2 TOOLS / GRATIS", tools:[["PhishTank","Database link phishing","https://phishtank.org"],["Google Safe Browsing","Cek reputasi domain","https://transparencyreport.google.com/safe-browsing/search"]]},
  password:{title:"PASSWORD <span>_</span>", desc:"Password lu udah bocor di database hacker?", meta:"1 TOOL / GRATIS", tools:[["Pwned Passwords","Cek password bocor","https://haveibeenpwned.com/Passwords"]]},
  ip:{title:"IP CHECK <span>_</span>", desc:"IP lu kebaca apa aja sama internet.", meta:"2 TOOLS / GRATIS", tools:[["What Is My IP","Lihat IP + ISP lu","https://whatismyipaddress.com"],["IP Info","Detail IP & lokasi","https://ipinfo.io"]]},
  pegasus:{title:"PEGASUS <span>_</span>", desc:"Cek indikasi spyware kelas negara kayak Pegasus.", meta:"ADVANCED / BUTUH PC", tools:[["MVT Project","Tool forensik Amnesty","https://github.com/mvt-project/mvt"],["Amnesty - Pegasus Project","Laporan investigasi","https://forbiddenstories.org"]]},
  file:{title:"CEK FILE <span>_</span>", desc:"File APK / PDF yang dikirim orang, aman atau enggak.", meta:"2 TOOLS / GRATIS", tools:[["VirusTotal File","Upload & scan","https://www.virustotal.com"],["Any.Run","Jalankan di sandbox","https://any.run"]]},
  email:{title:"EMAIL BOCOR <span>_</span>", desc:"Email lu pernah bocor di mana aja.", meta:"1 TOOL / GRATIS", tools:[["Have I Been Pwned","Cek email bocor","https://haveibeenpwned.com"]]},
  all:{title:"SEMUA TOOLS <span>_</span>", desc:"Semua tools di atas, dalam satu list.", meta:"8 KATEGORI / GRATIS", tools:[["VirusTotal","Scan file & link","https://www.virustotal.com"],["Have I Been Pwned","Cek email bocor","https://haveibeenpwned.com"],["URLScan","Cek link","https://urlscan.io"],["MVT - Pegasus","Forensik HP","https://github.com/mvt-project/mvt"]]},
};
function openTool(btn,key){
  document.querySelectorAll('.hotspot').forEach(b=>b.classList.remove('pressed'));
  btn.classList.add('pressed'); setTimeout(()=>btn.classList.remove('pressed'),350);
  const d=DATA[key]; document.getElementById('wTitle').innerHTML=d.title; document.getElementById('wDesc').innerText=d.desc; document.getElementById('wMeta').innerText=d.meta;
  document.getElementById('overlay').classList.add('open');
  const sk=document.getElementById('skeleton'); const list=document.getElementById('wList');
  list.innerHTML=''; sk.classList.add('show');
  setTimeout(()=>{ sk.classList.remove('show'); list.innerHTML=d.tools.map(t=>`<a class="tool-card" href="${t[2]}" target="_blank" rel="noopener" onclick="this.classList.add('pressed')"><span class="left"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></span><span><b>${t[0]}</b><small>${t[1]}</small></span></span><span class="arrow">→</span></a>`).join(''); },650);
}
function closeTool(){ document.getElementById('overlay').classList.remove('open'); }
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(()=>console.log("SW OK")).catch(e=>console.log("SW GAGAL",e));
  });
}
</script>
</body>
</html>
